<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a6b3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Assistant - Carnet Irlande 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* La page occupe exactement la hauteur libre : le fil défile, la barre de saisie reste au pouce. */
    body {
      padding-bottom: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      justify-content: space-between;
      flex: 0 0 auto;
    }
    .chat-header h1 { font-size: 1.05rem; }

    .btn-clear {
      background: rgba(255,255,255,0.16);
      border: none;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-clear:disabled { opacity: 0.4; }

    .chat-log {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 86%;
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }
    .msg.error {
      align-self: flex-start;
      background: #fdecea;
      border: 1px solid #f5c6cb;
      color: #a12622;
      border-bottom-left-radius: 5px;
    }
    .msg strong { font-weight: 700; }

    /* Écran d'accueil : quelques questions prêtes à toucher */
    .intro {
      margin: auto 0;
      text-align: center;
      color: var(--text-muted);
      padding: 12px 4px 20px;
    }
    .intro h2 { font-size: 1rem; color: var(--text); margin-bottom: 6px; }
    .intro p { font-size: 0.85rem; margin-bottom: 16px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 18px;
      padding: 9px 14px;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
    }
    .chip:active { background: var(--primary-light); }

    /* Indicateur d'attente */
    .typing { display: flex; gap: 5px; align-items: center; padding: 14px 15px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      animation: blink 1.3s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.5; }
    }

    /* Barre de saisie, juste au-dessus de la navigation */
    .composer {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      background: var(--nav-bg);
      border-top: 1px solid var(--border);
      margin-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
    }
    .composer textarea {
      flex: 1 1 auto;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 11px 15px;
      font-family: inherit;
      font-size: 16px;   /* 16px : empêche iOS de zoomer au focus */
      line-height: 1.4;
      max-height: 120px;
      background: var(--bg);
      color: var(--text);
    }
    .composer textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--bg-card);
    }
    .btn-send {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-send:disabled { background: #b6c8bd; cursor: default; }
    .btn-send svg {
      width: 21px; height: 21px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <header class="header chat-header">
    <h1>Assistant</h1>
    <button type="button" id="btn-clear" class="btn-clear">Effacer</button>
  </header>

  <div class="chat-log" id="chat-log" aria-live="polite"></div>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Posez votre question…"
              aria-label="Votre question" maxlength="2000" autocomplete="off"></textarea>
    <button type="submit" class="btn-send" id="btn-send" aria-label="Envoyer">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Carte</span>
    </a>
    <a href="itineraire.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      <span>Itin.</span>
    </a>
    <a href="lieux.html" class="nav-item">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Lieux</span>
    </a>
    <a href="journal.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Journal</span>
    </a>
    <a href="budget.html" class="nav-item">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Budget</span>

    <a href="assistant.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
      <span>Assistant</span>
    </a>
  </nav>

  <script src="js/assistant.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
